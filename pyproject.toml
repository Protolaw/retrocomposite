[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retrocomposite"
version = "0.1.0"
description = "Reproducible data preparation for SynPlanner composite-action experiments"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.scripts]
retrocomposite = "retrocomposite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

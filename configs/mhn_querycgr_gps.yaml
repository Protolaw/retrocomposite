# Explicit encoders: the upstream MHN example otherwise defaults molecules to GCN.
policy_type: ranking
architecture: mhn_ranking
embedder_type: gps
vector_dim: 512
num_conv_layers: 5
heads: 4
attn_type: performer
attn_dropout: 0.1
dropout: 0.4
learning_rate: 0.0005
num_epoch: 100
batch_size: 128
association_dim: 512
beta: 0.05
normalize_associations: true
rule_embedding_type: query_cgr_graph
rule_graph_schema_version: "1"
rule_graph_batch_size: 128
rule_embedder:
  embedder_type: gps
  vector_dim: 512
  num_conv_layers: 5
  heads: 4
  attn_type: performer
  dropout: 0.4
  attn_dropout: 0.1
logger:
  type: csv
